<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Copy That</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="panel">
    <p class="label">Copy selection as:</p>
    <div class="copy-controls">
      <button type="button" id="start-copy" class="copy-btn">Copy</button>
      <div class="mode-radios">
        <label class="radio-label">
          <input type="radio" name="copy-mode" id="copy-html" value="html" />
          HTML
        </label>
        <label class="radio-label">
          <input type="radio" name="copy-mode" id="copy-text" value="text" />
          Text
        </label>
      </div>
    </div>
    <p class="label section-label">Math mode:</p>
    <div class="mode-radios">
      <label class="radio-label">
        <input type="radio" name="math-mode" id="math-omml" value="omml" />
        Office Math Objects
      </label>
      <label class="radio-label">
        <input type="radio" name="math-mode" id="math-latex" value="latex" />
        LaTeX
      </label>
      <label class="radio-label">
        <input type="radio" name="math-mode" id="math-mathml" value="mathml" />
        MathML
      </label>
    </div>
    <label class="checkbox-label">
      <input type="checkbox" id="fix-single-char-equations" />
      Single-char equations as plain text (avoids OneNote/Graph <br /> bug)
    </label>
    <p id="error" class="error" hidden></p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
