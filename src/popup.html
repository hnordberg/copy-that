<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Copy That</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="panel">
    <p class="label">Copy selection as:</p>
    <div class="buttons">
      <button id="copy-html" type="button">Copy HTML</button>
      <button id="copy-text" type="button">Copy Text</button>
    </div>
    <label class="checkbox-label">
      <input type="checkbox" id="fix-single-char-equations" />
      Single-char equations as plain text (avoids OneNote/Graph <br /> bug)
    </label>
    <p id="error" class="error" hidden></p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
